---
modules-search: [ local ]
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
      - finished
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - packages
      - bootloader
      - finished
branding: influent
prompt-install: false
# La ejecución dentro de una sesión live requiere confirmación explícita antes de escribir el disco.
