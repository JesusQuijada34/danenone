$mod = SUPER
$danenone = /usr/local/bin

monitor=,preferred,auto,1
exec-once = hyprpaper
exec-once = sh -c '/usr/local/bin/influent-danenone-splashboot; /usr/local/bin/influent-danenone-firstboot; /usr/local/bin/influent-danenone-tour'
exec-once = sh -c 'sleep 1; exec /usr/local/bin/influent-danenone-shell'

# Fondo de marca

# Barra inferior y escritorio: reglas con efectos y valores explícitos.
# El Qt shell calcula su geometría; Hyprland aporta floating, pin, blur, sombra y animación.
windowrule = match:initial_title ^(Influent Danenone Taskbar)$, float on, pin on, no_border on, no_initial_focus on, size 100% 72, move 0 100%-72
windowrule = match:initial_title ^(Influent Danenone Desktop)$, float on, pin on, no_border on, no_initial_focus on, size 100% 100%, move 0 0


input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    snap {
        enabled = true
        window_gap = 8
        monitor_gap = 8
        respect_gaps = true
    }
    gaps_in = 6
    # top right bottom left: reserva la taskbar de 72 px más 14 px de seguridad.
    gaps_out = 14 14 86 14
    float_gaps = 1
    border_size = 2
    col.active_border = rgba(7eaeeeff) rgba(4f84c4ee) 45deg
    col.inactive_border = rgba(334663aa)
    layout = dwindle
}

decoration {
    rounding = 18
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = true
        popups = true
        noise = 0.012
        contrast = 0.92
        brightness = 0.86
        vibrancy = 0.16
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00081466)
    }
}

animations {
    enabled = true
    bezier = danenone, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, danenone, popin 20%
    animation = windowsIn, 1, 4, danenone, popin 20%
    animation = windowsOut, 1, 4, danenone, popin 20%
    animation = fadeIn, 1, 4, default
    animation = fadeOut, 1, 4, default
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

bind = $mod, RETURN, exec, foot
bind = $mod, E, exec, thunar
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
