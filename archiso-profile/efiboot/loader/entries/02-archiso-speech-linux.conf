title    Influent Danenone live environment (%ARCH%, UEFI) with accessibility reader
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on quiet splash loglevel=3 systemd.show_status=false systemd.status_unit_format=description rd.systemd.show_status=false udev.log_priority=3
