$mod = SUPER
$danenone = /usr/local/bin

monitor=,preferred,auto,1
exec-once = hyprpaper
exec-once = sh -c '/usr/local/bin/influent-danenone-splashboot; /usr/local/bin/influent-danenone-firstboot; /usr/local/bin/influent-danenone-tour'
exec-once = sh -c 'sleep 1; exec /usr/local/bin/influent-danenone-shell'

# Fondo de marca

# Barra inferior y notch: ventanas layer-shell reservan sus propias zonas

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(7eaeeeff) rgba(4f84c4ee) 45deg
    col.inactive_border = rgba(334663aa)
    layout = dwindle
}

decoration {
    rounding = 18
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00081466)
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

bind = $mod, RETURN, exec, foot
bind = $mod, E, exec, thunar
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
