---
# Preview-only template. It is intentionally installed under
# /usr/share/danenone/calamares-template instead of /etc/calamares.
# A future ISO must copy, complete and test this configuration before use.
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec: []
- show:
  - finished

branding: influent-danenone
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
